<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Exemplo 1</title>
	</head>
	<body>

		<!--table -> tabela -->
		<!--Iniciando a tabela -->
		<table border="1" width="100%">
			<!--thead cabeçalho da tabela -->
			<thead style="background-color: #E0E0E0; color: #000;">
				<!--Primeira linha -->
				<!--Linha da tabela -> tr -->
				<tr>
					<th colspan="5" style="background-color: #00A86B;">Tabela de Serviços Mecânicos</th>
				</tr>
				
			</thead>
			<!--tbody corpo da tabela -->
			<tbody>
			
				<tr>
				<!--th cabeçalho -->
					<th rowspan="5" style="background-color: #1591EA;">Nacionais</th>
					<th>diciplina</th>
					<th>Serviço</th>
					<th>Tempo Previsto</th>
					<th>Valor</th>
				</tr>
				
				<!--Segunda linha -->
				<!--Linha da tabela -> tr -->
				<tr>
					<!--td dados da tabela -->
					<td>Caminhonete S10</td>
					<td>suspensão</td>
					<td>3hr e 25m</td>
					<td>350,00</td>
				</tr>
				<!--Terceira linha -->
				<!--Linha da tabela -> tr -->
				<tr>
					<td>Caminhonete Ranger</td>
					<td>freio</td>
					<td>3Hr e 45m</td>
					<td>200,00</td>
				</tr>
				
				<tr>
					<td>Caminhonete Hilux</td>
					<td>Troca de bateria</td>
					<td>30m</td>
					<td>25,00</td>
				</tr>
				
				<tr>
					<td>Caminhonete D10</td>
					<td>Alinhamento</td>
					<td>3Hr e 40m</td>
					<td>220,00</td>
				</tr>
			</tbody>
		</table>
	</body>
</html>
