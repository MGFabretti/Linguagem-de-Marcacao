<!DOCTYLE html>
<html lang="pr-br">
	<head>
		<meta charset="UTF-8">
		<title>Cadastro do aluno</title>
	</head>
	<body>
		<header>
			<h1 style="text-align: center">Cadastro de aluno</h1>
			<hr>
		</header>
		
		<form action="#" method="POST">
			<label for="nome">Nome do aluno:</label>
			<br>
			<input type=""text" id="nome" name="nome" placeholder="Nome do aluno..." minlength="3" maxlength="255" required>
			<br><br>
			
			<label for="ra">registro da escola:</label>
			<br>
			<input type="text" id="ra" name="ra" value="20261015" disabled>
			<br><br>
			
			<label for="email">Email do aluno:</label>
			<br>
			<input type="email" id="email" name="email" placeholder="Email do aluno..." required>
			<br><br>
			
			<label for="email">Telefone do aluno:</label>
			<br>
			<input type="tel" id="telefone" name="telefone" placeholder="(00) 0000-0000" required>
			<br><br>
			
			<label for="data_nascimento">Data nascimento:</label>
			<br>
			<input type="date" id="data_nascimento" name="data_nascimento" max="2009-01-01" required>
			<br><br>
			
			<label for="idade">Idade do aluno:</label>
			<br>
			<input type="number" id="idade" name="idade" min="17" max="100" required>
			<br><br>
			
			<label for="genero">Genero</label>
			<br>
			<input type="radio" id="masculino" name="genero" value="masculino" required>masculino
			<br>
			<input type="radio" id="feminino" name="genero" value="feminino">feminino
			<br>
			<input type="radio" id="outros" name="genero" value="outros">outros
			<br><br>
			
			<label for="turma">Selecione sua turma:</label>
			<br>
			<select name="turma" id="turma" required>
				<option value="">Selecione...</option>
				<option value="1EMA">1 EM A</option>
				<option value="1EMB">1 EM B</option>
				<option value="2EMA">2 EM A</option>
				<option value="2EMB">2 EM B</option>
			</select>
			<br><br>
			
			<label for="foto">foto do aluno:</label>
			<br>
			<input type="file" id="foto" name="foto" required>
			<br><br>
			
			<label for="comentarios">Reclamaçoes comentarios elegios...</label>
			<br>
			<textarea id="comentarios" name="comentarios" placeholder="texto..."></textarea>
			<br><br>
			
			<input type="checkbox" id="termos" name="termos" required>Li e aceito o termos e condições
			<br>
			<input type="checkbox" id="notificacao" name="notificacao">Aceito receber notificações
			<br><br
			
			
			<input type="submit" value="Cadastrar aluno">
		</form>
	</body>
</html>
