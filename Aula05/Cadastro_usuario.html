<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Cadastro de Usuario</title>
	</head>
	<body>
		<!-- Cria o formulario 
		<form> - tag de formulario 
		atributo "action" aponta para a página
		atributo "method":
			-GET: passa dados a URL
			-POST: Passa os dados pelo corpo
		-->
		<form action="#" method="POST">
			<!-- label rotulo -->
			<label>Nome completo:</label>
			<br>
			
			<!-- input entrada de dados
				TYPE - tipo do campo
				Id - Indetificador (javascript)
				NAME - identificador (php)
			-->
			<input type="text" id="nome" name="nome">
			<br><br>
			
			<!-- input subit cria um botão -->
			<input type="submit" value="Cadastrar">
		</form>
	</body>
</html>
