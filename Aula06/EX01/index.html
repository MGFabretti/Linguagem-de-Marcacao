<body>
    <p id="poema-divo">
        AS BORBOLETAS

        Brancas
        Azuis
        Amarelas
        E pretas
        Brincam
        Na luz
        As belas
        Borboletas.

        Borboletas brancas
        São alegres e francas.

        Borboletas azuis
        Gostam muito de luz.

        As amarelinhas
        São tão bonitinhas!

        E as pretas, então...
        Oh, que escuridão!
    </p>
